name: CI
on:
  pull_request:
  push:
    branches: [main]
# The jobs run on Li's own runner (docs/ci.md), so their token can only read.
permissions:
  contents: read
# One runner: a newer push to a PR replaces its older runs; main tests every commit.
# (A group keeps one pending run, so main's groups are per commit.)
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: lyrica-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No actions cache for npm: the runner keeps ~/.npm between runs, so
      # npm ci downloads only what changed.
      # The sandbox tests need these, and run as the runner's unprivileged user.
      # Ubuntu 24.04's AppArmor blocks unprivileged user namespaces by default.
      # needrestart must not restart services (it once restarted this runner
      # mid-job), and apt waits for a busy dpkg lock instead of failing. The
      # same as setup.sh, for runners set up before it did this.
      - run: |
          echo "\$nrconf{restart} = 'l';" | sudo tee /etc/needrestart/conf.d/lyrica-ci.conf >/dev/null 2>&1 || true
          echo 'DPkg::Lock::Timeout "600";' | sudo tee /etc/apt/apt.conf.d/90lyrica-ci >/dev/null
          sudo apt-get update
          sudo apt-get install -y build-essential bubblewrap gocryptfs fuse3 openssh-server passt nftables
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          LYRICA_SANDBOX_TESTS: require
      - run: npm run build
      # Playwright drives the web UI against a real lyricad (web/e2e/serve.ts).
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run e2e -w @lyrica/web
  # The flake (docs/daemon.md, "On NixOS"): the package and a NixOS system with the module
  # build, and the sandbox tests pass with the module's sandbox tools as /usr
  # and only their closure in /nix/store.
  nix:
    runs-on: lyrica-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Nix stays on the runner between runs, like the apt packages. The
      # installer is pinned by hash and checks its own download.
      - name: Install Nix
        run: |
          if [ ! -x /nix/var/nix/profiles/default/bin/nix ]; then
            # A cancelled install leaves these, and the installer then refuses to run.
            # find exits 1 on /etc's root-only directories, which bash -e would turn into a silent stop.
            left=$(find /etc -maxdepth 2 -name '*.backup-before-nix' 2>/dev/null || true)
            if [ -n "$left" ]; then
              echo "$left"
              echo "::error::An earlier Nix install on this runner stopped partway. Undo it with the Nix manual's multi-user uninstall steps (restore the files above, remove /nix and /etc/nix, the nix-daemon units and the nixbld users), then re-run this job."
              exit 1
            fi
            curl -fsSL -o "$RUNNER_TEMP/nix-install" https://releases.nixos.org/nix/nix-2.34.6/install
            echo "bf6d12da4aeaae38ab509dc736df648597bcdee051046ea76d3d53d5b18fa54a  $RUNNER_TEMP/nix-install" | sha256sum -c -
            sh "$RUNNER_TEMP/nix-install" --daemon --yes
          fi
          echo /nix/var/nix/profiles/default/bin >>"$GITHUB_PATH"
      # The same needrestart and dpkg lock settings as the check job.
      - run: |
          echo "\$nrconf{restart} = 'l';" | sudo tee /etc/needrestart/conf.d/lyrica-ci.conf >/dev/null 2>&1 || true
          echo 'DPkg::Lock::Timeout "600";' | sudo tee /etc/apt/apt.conf.d/90lyrica-ci >/dev/null
          sudo apt-get update
          sudo apt-get install -y build-essential gocryptfs fuse3
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: nix --extra-experimental-features "nix-command flakes" flake check -L
      - run: npm ci
      - name: Sandbox tests with the NixOS sandbox tools
        run: |
          nix() { command nix --extra-experimental-features "nix-command flakes" "$@"; }
          tools=$(nix build --no-link --print-out-paths .#sandbox-tools)
          closure=$(nix build --no-link --print-out-paths .#sandbox-closure)/store-paths
          PATH="$tools/bin:$PATH" LYRICA_SANDBOX_TOOLS="$tools" LYRICA_SANDBOX_CLOSURE="$closure" npx vitest --run core/test/sandbox.test.ts
        env:
          LYRICA_SANDBOX_TESTS: require
  # The model host's Compose stack, without a GPU: install, then check the networks.
  host-stack:
    runs-on: lyrica-ci
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p "$RUNNER_TEMP/models"
      # Build the images first: Docker 29 hands build steps the loopback
      # resolver below as is, and they can't reach it. (GitHub's runners have
      # Docker 28.)
      - name: Build the images
        run: |
          host/install.sh --no-gpu --yes --models "$RUNNER_TEMP/models" --name ci-host --no-start
          cd host && docker compose build
      # Docker forwards outside names to a loopback resolver from its own
      # namespace: the case host-api's blackhole DNS setting must cover.
      - name: Docker with a loopback DNS resolver
        run: |
          echo '{"dns": ["127.0.0.53"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
      - run: host/install.sh --no-gpu --yes --models "$RUNNER_TEMP/models" --name ci-host
      - run: host/test/stack/network.sh
      # Again with the Tailscale service (not logged in: no auth key in CI).
      - run: host/install.sh --no-gpu --yes --tailscale ci-host-ts
      - run: host/test/stack/network.sh
      - if: failure()
        run: docker compose logs
        working-directory: host
      # The runner is kept between jobs: leave nothing for the next run, not
      # the stack and its volumes, the egress unit and rules, or the Docker
      # setting from the DNS step (setup.sh leaves no daemon.json).
      - if: always()
        working-directory: host
        run: |
          docker compose down -v --remove-orphans || true
          sudo systemctl disable --now lyrica-host-egress.service || true
          sudo rm -f /etc/systemd/system/lyrica-host-egress.service
          sudo systemctl daemon-reload
          sudo ./egress.sh remove || true
          sudo rm -f /etc/docker/daemon.json
          sudo systemctl restart docker
