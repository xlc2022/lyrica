name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The sandbox tests need these, and run as the runner's unprivileged user.
      # Ubuntu 24.04's AppArmor blocks unprivileged user namespaces by default.
      - run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap gocryptfs fuse3 openssh-server
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          LYRICA_SANDBOX_TESTS: require
