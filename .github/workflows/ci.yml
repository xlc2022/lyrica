name: CI
on:
  pull_request:
  push:
    branches: [main]
# The jobs run on GitHub's hosted runners for now (docs/ci.md); their token can only read.
permissions:
  contents: read
# A newer push to a PR cancels its older runs. Main runs the newest merge
# only: a main run still waiting for a runner gives way to the next merge
# (a group keeps one pending run), and one already running finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Each job below runs only when the diff touches what it checks; skipped
  # jobs count as passed for required checks, and when the diff can't be
  # read, all run. A change to the workflows runs all of them.
  # - check: anything but docs/ and the top-level Markdown files (AGENTS.md,
  #   DESIGN.md and the like). persona/ is her seed and counts as code.
  # - nix: anything the flake builds or tests, so not the tests it leaves
  #   out of its source (flake.nix) except core/test, which has the sandbox
  #   tests, and not evals/.
  # - host-stack: host/, the only directory its images and install read.
  changes:
    runs-on: ubuntu-latest
    # Reads main's last passing run.
    permissions:
      contents: read
      actions: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
      nix: ${{ steps.diff.outputs.nix }}
      host: ${{ steps.diff.outputs.host }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          RUNS: ${{ github.api_url }}/repos/${{ github.repository }}/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1
        run: |
          # A pull request's checkout is its merge into the base: the first parent is the base.
          # Main diffs from its last passing run, since merges in between may not have run.
          if [ "$EVENT" = pull_request ]; then
            base=HEAD^1
          else
            base=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "$RUNS" | grep -o '"head_sha": *"[0-9a-f]*"' | head -1 | grep -o '[0-9a-f]\{40\}') || true
            echo "last passing run on main: ${base:-none}"
          fi
          # outside PATTERN: some changed file is not one PATTERN matches.
          outside() { printf '%s\n' "$files" | grep -qvE "$1"; }
          if files=$(git diff --name-only "$base" HEAD 2>/dev/null) && [ -n "$files" ]; then
            docs='^docs/|^[^/]+\.md$'
            if outside "$docs"; then code=true; else code=false; fi
            if outside "$docs|^evals/|^web/e2e/|^(bin|daemon|extension|host|web)/test/"; then nix=true; else nix=false; fi
            if printf '%s\n' "$files" | grep -qE '^host/|^\.github/'; then host=true; else host=false; fi
            if printf '%s\n' "$files" | grep -qE '^\.github/'; then code=true nix=true; fi
          else
            code=true nix=true host=true
          fi
          printf '%s\n' "$files" | head -50
          printf 'code=%s\nnix=%s\nhost=%s\n' "$code" "$nix" "$host" | tee -a "$GITHUB_OUTPUT"
  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Stop what earlier jobs left running
        run: .github/runner/clear-leftovers.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # No actions cache for npm: the runner keeps ~/.npm between runs, so
      # npm ci downloads only what changed.
      # The sandbox tests need these, and run as the runner's unprivileged user.
      # Ubuntu 24.04's AppArmor blocks unprivileged user namespaces by default.
      # needrestart must not restart services (it once restarted this runner
      # mid-job), and apt waits for a busy dpkg lock instead of failing. The
      # same as setup.sh, for runners set up before it did this.
      - run: |
          echo "\$nrconf{restart} = 'l';" | sudo tee /etc/needrestart/conf.d/lyrica-ci.conf >/dev/null 2>&1 || true
          echo 'DPkg::Lock::Timeout "600";' | sudo tee /etc/apt/apt.conf.d/90lyrica-ci >/dev/null
          sudo apt-get update
          sudo apt-get install -y build-essential bubblewrap gocryptfs fuse3 openssh-server passt nftables
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          LYRICA_SANDBOX_TESTS: require
      - run: npm run build
      # Playwright drives the web UI against a real lyricad (web/e2e/serve.ts).
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run e2e -w @lyrica/web
      # A failed test's trace (only made-up test data), so an intermittent failure can be read rather than re-run.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-traces-${{ github.run_attempt }}
          path: web/test-results/
          retention-days: 7
          if-no-files-found: ignore
      # The page as each failed test left it, in the log itself: the artifact needs a download that not every reader has.
      - if: failure()
        run: for f in web/test-results/*/error-context.md; do [ -f "$f" ] && { echo "::group::$f"; head -c 20000 "$f"; echo "::endgroup::"; }; done; true
  # The flake (docs/daemon.md, "On NixOS"): the package and a NixOS system with the module
  # build, and the sandbox tests pass with the module's sandbox tools as /usr
  # and only their closure in /nix/store.
  nix:
    needs: changes
    if: needs.changes.outputs.nix == 'true'
    runs-on: ubuntu-latest
    # The Nix store cache below removes its own older copies.
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Stop what earlier jobs left running
        run: .github/runner/clear-leftovers.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # On a self-hosted runner Nix stays between runs, like the apt packages.
      # The installer is pinned by hash and checks its own download.
      - name: Install Nix
        run: |
          if [ ! -x /nix/var/nix/profiles/default/bin/nix ]; then
            # A cancelled install leaves these, and the installer then refuses to run.
            # find exits 1 on /etc's root-only directories, which bash -e would turn into a silent stop.
            left=$(find /etc -maxdepth 2 -name '*.backup-before-nix' 2>/dev/null || true)
            if [ -n "$left" ]; then
              echo "$left"
              echo "::error::An earlier Nix install on this runner stopped partway. Undo it with the Nix manual's multi-user uninstall steps (restore the files above, remove /nix and /etc/nix, the nix-daemon units and the nixbld users), then re-run this job."
              exit 1
            fi
            curl -fsSL -o "$RUNNER_TEMP/nix-install" https://releases.nixos.org/nix/nix-2.34.6/install
            echo "bf6d12da4aeaae38ab509dc736df648597bcdee051046ea76d3d53d5b18fa54a  $RUNNER_TEMP/nix-install" | sha256sum -c -
            sh "$RUNNER_TEMP/nix-install" --daemon --yes
          fi
          # Collecting garbage keeps what the kept builds were built from, so they stay cached.
          if ! grep -qx 'keep-outputs = true' /etc/nix/nix.conf; then
            echo 'keep-outputs = true' | sudo tee -a /etc/nix/nix.conf >/dev/null
            sudo systemctl restart nix-daemon
          fi
          echo /nix/var/nix/profiles/default/bin >>"$GITHUB_PATH"
      # A hosted runner starts with an empty store, and the flake check then
      # fetches and builds for about 15 minutes. The store is kept in the
      # Actions cache instead: main saves it when the flake, nix/ or the npm
      # lockfile changed (after the last step roots the run's builds and
      # collects the rest), and every run restores main's newest copy.
      - if: runner.environment == 'github-hosted'
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-store-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'nix/**', 'package-lock.json') }}
          restore-prefixes-first-match: nix-store-${{ runner.os }}-
          save: ${{ github.event_name == 'push' }}
          gc-max-store-size-linux: 8G
          purge: ${{ github.event_name == 'push' }}
          purge-prefixes: nix-store-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
      # The same needrestart and dpkg lock settings as the check job.
      - run: |
          echo "\$nrconf{restart} = 'l';" | sudo tee /etc/needrestart/conf.d/lyrica-ci.conf >/dev/null 2>&1 || true
          echo 'DPkg::Lock::Timeout "600";' | sudo tee /etc/apt/apt.conf.d/90lyrica-ci >/dev/null
          sudo apt-get update
          sudo apt-get install -y build-essential gocryptfs fuse3
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      # Claude Code is unfree, so no binary cache has it; its download is kept
      # between runs so the build doesn't fetch it each time (and get a 429).
      # Saved right after seeding, so a later failing step doesn't lose it.
      - id: claude-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/lyrica-ci/fixed
          key: claude-code-2-${{ hashFiles('flake.lock') }}
          restore-keys: claude-code-2-
      - name: Seed Claude Code's download
        run: .github/runner/seed-claude-code.sh ~/.cache/lyrica-ci/fixed
      - if: steps.claude-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/lyrica-ci/fixed
          key: claude-code-2-${{ hashFiles('flake.lock') }}
      - run: nix --extra-experimental-features "nix-command flakes" flake check -L
      - run: npm ci
      - name: Sandbox tests with the NixOS sandbox tools
        run: |
          nix() { command nix --extra-experimental-features "nix-command flakes" "$@"; }
          tools=$(nix build --no-link --print-out-paths .#sandbox-tools)
          closure=$(nix build --no-link --print-out-paths .#sandbox-closure)/store-paths
          PATH="$tools/bin:$PATH" LYRICA_SANDBOX_TOOLS="$tools" LYRICA_SANDBOX_CLOSURE="$closure" npx vitest --run core/test/sandbox.test.ts
        env:
          LYRICA_SANDBOX_TESTS: require
      # Each run's builds are one generation of a profile; the 10 newest stay, the rest are collected.
      # On a hosted runner this is what the store cache above saves.
      - name: Keep the last 10 builds
        run: |
          nix() { command nix --extra-experimental-features "nix-command flakes" "$@"; }
          profile="$HOME/.local/state/nix/profiles/lyrica-ci"
          mkdir -p "${profile%/*}"
          nix build --profile "$profile" .#checks.x86_64-linux.roots
          nix-env --profile "$profile" --delete-generations +10
          nix store gc
  # The model host's Compose stack, without a GPU: install, then check the networks.
  host-stack:
    needs: changes
    if: needs.changes.outputs.host == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Stop what earlier jobs left running
        run: .github/runner/clear-leftovers.sh
      # A lyrica/ subfolder made with a tight umask: install.sh opens it to the model servers.
      - run: mkdir -p -m 700 "$RUNNER_TEMP/models/lyrica"
      # Build the images first: Docker 29 hands build steps the loopback
      # resolver below as is, and they can't reach it. (GitHub's runners have
      # Docker 28.)
      - name: Build the images
        run: |
          host/install.sh --no-gpu --yes --models "$RUNNER_TEMP/models" --name ci-host --no-start
          cd host && docker compose build
      # Docker forwards outside names to a loopback resolver from its own
      # namespace: the case host-api's blackhole DNS setting must cover.
      - name: Docker with a loopback DNS resolver
        run: |
          echo '{"dns": ["127.0.0.53"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
      - run: host/install.sh --no-gpu --yes --models "$RUNNER_TEMP/models" --name ci-host
      - run: test "$(stat -c '%u %a' "$RUNNER_TEMP/models/lyrica")" = "10001 755"
      - run: host/test/stack/network.sh
      # Again with the Tailscale service (not logged in: no auth key in CI).
      - run: host/install.sh --no-gpu --yes --tailscale ci-host-ts
      - run: host/test/stack/network.sh
      - if: failure()
        run: docker compose logs
        working-directory: host
      # The runner is kept between jobs: leave nothing for the next run, not
      # the stack and its volumes, the egress and updater units and rules, the
      # updater's folders and deploy key, or the Docker setting from the DNS
      # step (setup.sh leaves no daemon.json).
      - if: always()
        working-directory: host
        run: |
          docker compose down -v --remove-orphans || true
          sudo systemctl disable --now lyrica-host-egress.service lyrica-host-update.path || true
          sudo rm -f /etc/systemd/system/lyrica-host-egress.service /etc/systemd/system/lyrica-host-update.path /etc/systemd/system/lyrica-host-update.service /usr/local/sbin/lyrica-host-update
          sudo rm -rf /var/lib/lyrica-host-update /etc/lyrica-host /opt/lyrica-host
          sudo systemctl daemon-reload
          sudo ./egress.sh remove || true
          sudo rm -f /etc/docker/daemon.json
          sudo systemctl restart docker
