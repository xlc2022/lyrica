name: Host images
# The model host's ComfyUI images (CUDA and ROCm) are large, so they build
# only when what goes into them changes. The starter recipes are checked
# against Hugging Face here too, since that needs the internet.
on:
  pull_request:
    paths: ["host/comfyui/**", "host/compose.nvidia.yaml", "host/compose.amd.yaml", "host/recipes/**", ".github/workflows/host-images.yml"]
  push:
    branches: [main]
    paths: ["host/comfyui/**", "host/compose.nvidia.yaml", "host/compose.amd.yaml", "host/recipes/**"]
jobs:
  comfyui:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vendor: [nvidia, amd]
    steps:
      - uses: actions/checkout@v4
      # The ROCm base image alone is about 12 GB compressed: free the root disk,
      # and keep Docker's images on the runner's larger /mnt disk.
      - name: Make room
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /opt/microsoft
          sudo systemctl stop docker docker.socket
          sudo mkdir -p /mnt/docker
          echo '{"data-root": "/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          df -h / /mnt
      - name: Build
        run: |
          base=$(sed -n 's/^ *BASE: //p' host/compose.${{ matrix.vendor }}.yaml)
          echo "base: $base"
          docker buildx build -f host/comfyui/Dockerfile --build-arg "BASE=$base" --output type=cacheonly .
  starters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node host/recipes/check.ts
