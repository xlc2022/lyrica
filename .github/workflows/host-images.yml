name: Host images
# The model host's ComfyUI images (CUDA and ROCm) and the speech server's
# CUDA image are large, so they build only when what goes into them changes.
# (The speech server's CPU image builds in CI's host-stack job.) The starter recipes are checked
# against Hugging Face here too, since that needs the internet.
on:
  pull_request:
    paths: ["host/comfyui/**", "host/speech/**", "host/compose.nvidia.yaml", "host/compose.amd.yaml", "host/recipes/**", ".github/workflows/host-images.yml", ".github/runner/make-room.sh"]
  push:
    branches: [main]
    paths: ["host/comfyui/**", "host/speech/**", "host/compose.nvidia.yaml", "host/compose.amd.yaml", "host/recipes/**"]
# The jobs run on the operator's own runners (docs/ci.md), so their token can only read.
# The repository is public: a pull request from a fork runs on GitHub's
# runners instead, since every job runs the branch's code with root.
permissions:
  contents: read
# One runner: a newer push to a PR replaces its older runs; main tests every commit.
# (A group keeps one pending run, so main's groups are per commit.)
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true
jobs:
  comfyui:
    runs-on: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && 'lyrica-ci' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        vendor: [nvidia, amd]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The ROCm base image is about 12 GB compressed and over 30 GB unpacked.
      # On GitHub's runners: free the disk, and use Docker's classic overlay2
      # store, which drops each compressed layer once it is unpacked (the
      # containerd store keeps both).
      - name: Make room
        if: runner.environment == 'github-hosted'
        run: |
          sudo swapoff -a && sudo rm -f /mnt/swapfile /swapfile
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /opt/microsoft \
            /usr/local/.ghcup /usr/share/swift /usr/local/julia* /usr/lib/jvm /opt/az /usr/local/share/powershell /opt/google /usr/local/lib/node_modules \
            /usr/share/miniconda /usr/local/share/chromium /opt/pipx
          sudo systemctl stop docker docker.socket
          sudo rm -rf /var/lib/docker
          echo '{"features": {"containerd-snapshotter": false}}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          docker info --format '{{.Driver}}'
          df -h /
      # On the self-hosted runners, which keep Docker's cache between jobs: the ROCm
      # build needs about 45 GB free, the CUDA one 40.
      - name: Make room
        if: runner.environment == 'self-hosted'
        run: .github/runner/make-room.sh ${{ matrix.vendor == 'amd' && 45 || 40 }}
      - name: Build
        run: |
          base=$(sed -n 's/^ *BASE: //p' host/compose.${{ matrix.vendor }}.yaml)
          echo "BASE=$base" >>"$GITHUB_ENV"
          echo "base: $base"
          docker buildx build -f host/comfyui/Dockerfile --build-arg "BASE=$base" --output type=cacheonly .
      # The build's cache would hold most of that disk until the weekly prune,
      # starving the other jobs on this runner.
      - name: Clear the build cache
        if: always() && runner.environment == 'self-hosted'
        run: |
          docker system df
          docker builder prune -af >/dev/null
          if [ -n "$BASE" ]; then docker image rm "$BASE" >/dev/null 2>&1 || true; fi
          df -h /var/lib/docker
  speech:
    runs-on: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && 'lyrica-ci' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Make room
        if: runner.environment == 'self-hosted'
        run: .github/runner/make-room.sh 30
      - name: Build the CUDA image
        run: docker buildx build -f host/speech/Dockerfile --build-arg FLAVOUR=cuda --output type=cacheonly .
  starters:
    runs-on: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && 'lyrica-ci' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node host/recipes/check.ts
