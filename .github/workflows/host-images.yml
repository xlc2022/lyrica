name: Host images
# The model host's ComfyUI images (CUDA and ROCm) are large, so they build
# only when what goes into them changes. The starter recipes are checked
# against Hugging Face here too, since that needs the internet.
on:
  pull_request:
    paths: ["host/comfyui/**", "host/compose.nvidia.yaml", "host/compose.amd.yaml", "host/recipes/**", ".github/workflows/host-images.yml"]
  push:
    branches: [main]
    paths: ["host/comfyui/**", "host/compose.nvidia.yaml", "host/compose.amd.yaml", "host/recipes/**"]
# The jobs run on Li's own runner (docs/ci.md), so their token can only read.
permissions:
  contents: read
jobs:
  comfyui:
    runs-on: lyrica-ci
    strategy:
      fail-fast: false
      matrix:
        vendor: [nvidia, amd]
    steps:
      - uses: actions/checkout@v4
      # The ROCm base image is about 12 GB compressed and over 30 GB unpacked.
      # Free the runner's disk, and use Docker's classic overlay2 store, which
      # drops each compressed layer once it is unpacked (the containerd store
      # keeps both). Only on GitHub's runners: Li's runner has the disk, and
      # keeps its Docker cache between builds.
      - name: Make room
        if: runner.environment == 'github-hosted'
        run: |
          sudo swapoff -a && sudo rm -f /mnt/swapfile /swapfile
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /opt/microsoft \
            /usr/local/.ghcup /usr/share/swift /usr/local/julia* /usr/lib/jvm /opt/az /usr/local/share/powershell /opt/google /usr/local/lib/node_modules \
            /usr/share/miniconda /usr/local/share/chromium /opt/pipx
          sudo systemctl stop docker docker.socket
          sudo rm -rf /var/lib/docker
          echo '{"features": {"containerd-snapshotter": false}}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          docker info --format '{{.Driver}}'
          df -h /
      - name: Build
        run: |
          base=$(sed -n 's/^ *BASE: //p' host/compose.${{ matrix.vendor }}.yaml)
          echo "base: $base"
          docker buildx build -f host/comfyui/Dockerfile --build-arg "BASE=$base" --output type=cacheonly .
  starters:
    runs-on: lyrica-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node host/recipes/check.ts
