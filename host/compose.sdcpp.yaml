# Images on a CMP 100-210 (10de:1df4 or 10de:1d84): install.sh adds this when
# COMFY_GPU is one. stable-diffusion.cpp's sd-server (sdcpp/Dockerfile),
# built to use int8 by CI or here, makes the images in ComfyUI's place,
# which isn't started. It uses one GPU, the first in COMFY_GPU, and runs only while a
# recipe is loaded (sdcpp/gate.sh reads serving/sdcpp.json).
volumes:
  # gate.sh names the sd-server it is running; host-api reads it.
  sdcpp-status: {}

services:
  host-api:
    environment:
      SDCPP_URL: http://sdcpp:8188
    volumes:
      - sdcpp-status:/sdcpp-status:ro

  comfyui:
    profiles: [comfyui]

  sdcpp:
    # The image CI publishes (prebuilt.sh), or one built here (compose.sdcpp.build.yaml).
    image: ${SDCPP_IMAGE:?run install.sh}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
    environment:
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      CUDA_VISIBLE_DEVICES: ${COMFY_GPU:-0}
    networks: [models]
    logging: { driver: none } # it would keep prompts in Docker's logs
    depends_on:
      host-api: { condition: service_healthy }
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]
    volumes:
      - ${MODELS_DIR}:/models:ro
      - serving:/serving:ro
      - sdcpp-status:/status
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "/app/gate.sh", "--health"]
      interval: 30s
      timeout: 10s
      retries: 3
