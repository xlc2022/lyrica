# AMD GPUs that ROCm doesn't support (older Vega, integrated GPUs like the
# 780M): llama.cpp on Vulkan, and nothing else. vLLM and ComfyUI need ROCm,
# so this host serves llama.cpp models only. host-api reads memory from
# sysfs and needs no device.
x-server: &server
  restart: unless-stopped
  networks: [models]
  logging: { driver: none } # Docker would keep their output on disk
  depends_on:
    host-api: { condition: service_healthy }
  devices: [/dev/dri]
  group_add: [video, "${RENDER_GID:-render}"]

services:
  llamacpp:
    <<: *server
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan-b11960@sha256:c9aba1a673382ad356a72fb63e6cd73e8c021797e904b6c099bfe130217df62e
    environment:
      # Keep the driver's device order (Mesa's device-select layer would put
      # the display GPU first), so Vulkan0, Vulkan1 ... follow PCI address,
      # as host-api numbers them.
      NODEVICE_SELECT: "1"
    # --no-slots: no endpoint that would show what's being generated.
    command: [--models-preset, /serving/llamacpp.ini, --no-models-autoload, --models-max, "0", --no-slots, --host, 0.0.0.0, --port, "8080"]
    volumes:
      - ${MODELS_DIR}:/models:ro
      - serving:/serving:ro
    tmpfs: [/tmp]
