<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lyrica model host</title>
<link rel="stylesheet" href="/dashboard.css">
</head>
<body>
<p id="error" class="error banner" role="alert" hidden></p>

<div id="login" class="signin" hidden>
  <div>
    <h1 id="login-name">Lyrica model host</h1>
    <p class="facts">key <code id="login-fingerprint" title="Check it against the fingerprint install.sh printed."></code></p>
  </div>
  <p id="login-unset" class="warn-text" hidden>No password is set. Set one on the dashboard at this machine, <code>http://127.0.0.1:7236</code>.</p>
  <form id="login-form">
    <label class="field"><span>Password</span><input type="password" id="login-password" autocomplete="current-password" required></label>
    <button class="primary" type="submit">Sign in</button>
  </form>
</div>

<div id="main" hidden>
  <header class="head">
    <div class="head-title">
      <div class="title-line"><h1 id="name">Lyrica model host</h1><span id="state" class="state"></span></div>
      <p class="facts" id="facts"></p>
      <p class="facts">key <code id="fingerprint" title="Check it against the fingerprint install.sh printed."></code></p>
    </div>
    <div class="head-actions" id="head-actions"></div>
  </header>
  <div id="problems" class="banner" hidden></div>
  <div class="page">
    <nav class="subnav" id="subnav" aria-label="Sections"></nav>
    <main class="content" id="content"></main>
  </div>
</div>

<dialog id="confirm">
  <form method="dialog">
    <p id="confirm-text"></p>
    <div class="dlg-actions"><button value="cancel" type="submit">Cancel</button><button value="ok" type="submit" id="confirm-ok" class="primary">OK</button></div>
  </form>
</dialog>
<script src="/dashboard.js"></script>
</body>
</html>
