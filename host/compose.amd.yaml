# AMD: ROCm images for the model servers. host-api reads VRAM from sysfs and
# needs no device.
x-server: &server
  restart: unless-stopped
  networks: [models]
  logging: { driver: none } # Docker would keep their output on disk
  depends_on:
    host-api: { condition: service_healthy }
  devices: [/dev/kfd, /dev/dri]
  group_add: [video, "${RENDER_GID:-render}"]

services:
  llamacpp:
    <<: *server
    image: ghcr.io/ggml-org/llama.cpp:server-rocm-b11960@sha256:be8c5b9a0cece64e7c082c1bb7106adc243af2c0b2aa076713b3a9c2681b3446
    # --no-slots: no endpoint that would show what's being generated.
    command: [--models-preset, /serving/llamacpp.ini, --no-models-autoload, --models-max, "0", --no-slots, --host, 0.0.0.0, --port, "8080"]
    volumes:
      - ${MODELS_DIR}:/models:ro
      - serving:/serving:ro
    tmpfs: [/tmp]

  vllm:
    <<: *server
    image: rocm/vllm:rocm10.1.0_ubuntu24.04_py3.14-pytorch_2.13.0_vllm-0.29.0@sha256:e0ea9a10b729573ea8598bdc073bda0ea382fe1037eec7c0761b6fa7f46baaf4
    entrypoint: [python3, /lyrica/supervisor.py]
    init: true # reaps what vLLM's engine processes leave behind
    shm_size: 16gb
    environment:
      HF_HUB_OFFLINE: "1"
      VLLM_NO_USAGE_STATS: "1"
      DO_NOT_TRACK: "1"
    volumes:
      - ${MODELS_DIR}:/models:ro
      - serving:/serving:ro
      - vllm-status:/status
      - ./vllm:/lyrica:ro
    tmpfs: [/tmp, /root/.cache]

  # Ours, built from host/comfyui/Dockerfile: a ComfyUI per GPU in COMFY_GPU
  # (one, or a list such as 0,1), on ports 8188 up.
  comfyui:
    <<: *server
    build:
      context: ..
      dockerfile: host/comfyui/Dockerfile
      args:
        BASE: rocm/pytorch:rocm10.1.0_ubuntu24.04_py3.12_pytorch_release_2.14.0@sha256:099f59a3bee9c436f5cc57db6bc6076fdeda579c57e9e22ae40f856d5905b3e4
    image: lyrica-host-comfyui:rocm
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      HIP_VISIBLE_DEVICES: ${COMFY_GPU:-0}
      # As on NVIDIA: Triton builds and loads helpers at run time; /tmp is noexec.
      TRITON_CACHE_DIR: /triton
    volumes:
      - ${MODELS_DIR}:/models:ro
      - serving:/serving:ro
      - comfyui-status:/status
    tmpfs: [/tmp, "/triton:exec,mode=1777"]
    init: true
    healthcheck:
      # Healthy while off as host-api asks, or on and answering.
      test: ["CMD", "python3", "/opt/gate.py", "--health"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 3
