# A CMP 100-210 (PCI ID 10de:1df4 or 10de:1d84), added by install.sh when it
# finds one.
# llama.cpp's image (llamacpp/Dockerfile) checks at each start whether the
# card's FP16 tensor cores are throttled or unlocked (cmp-unlock.sh) and picks
# its kernels to suit: the image CI publishes (prebuilt.sh), or one built here
# for this host's GPUs (compose.cmp.build.yaml), as install.sh chose. Other
# cards' kernels don't change, except a V100 beside a throttled CMP, which
# gets the CMP's for a little less speed on long prompts.
services:
  llamacpp:
    image: ${LLAMACPP_CMP_IMAGE:?run install.sh}
