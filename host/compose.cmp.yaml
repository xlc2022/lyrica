# A CMP 100-210 (PCI ID 10de:1df4), added by install.sh when it finds one.
# Its FP16 tensor cores are throttled, so llama.cpp is built to use int8
# (llamacpp/Dockerfile): the image CI publishes (prebuilt.sh), or one built
# here for this host's GPUs (compose.cmp.build.yaml), as install.sh chose.
services:
  llamacpp:
    image: ${LLAMACPP_CMP_IMAGE:?run install.sh}
