# NVIDIA: CUDA images for the model servers. host-api gets the "utility"
# capability only, for nvidia-smi's memory readings.
x-server: &server
  restart: unless-stopped
  networks: [models]
  logging: { driver: none } # Docker would keep their output on disk
  depends_on:
    host-api: { condition: service_healthy }
  deploy:
    resources:
      reservations:
        devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

services:
  host-api:
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu, utility] }]

  llamacpp:
    <<: *server
    image: ghcr.io/ggml-org/llama.cpp:server-cuda-b11459@sha256:fff6185edd2fbc4093aa5970bf6db53ed11c283e3a1c52a3e244cf27047264f4
    command: [--models-preset, /serving/llamacpp.ini, --no-models-autoload, --models-max, "0", --host, 0.0.0.0, --port, "8080"]
    volumes:
      - ${MODELS_DIR}:/models:ro
      - serving:/serving:ro
    tmpfs: [/tmp]

  vllm:
    <<: *server
    image: vllm/vllm-openai:v0.30.0@sha256:8a69ffad015f138d7170c4ddc429e230a3bc1c1719f67e14324749df200a4b90
    entrypoint: [python3, /lyrica/supervisor.py]
    shm_size: 16gb
    environment:
      HF_HUB_OFFLINE: "1"
      VLLM_NO_USAGE_STATS: "1"
      DO_NOT_TRACK: "1"
    volumes:
      - ${MODELS_DIR}:/models:ro
      - serving:/serving:ro
      - ./vllm:/lyrica:ro
    tmpfs: [/tmp, /root/.cache]
