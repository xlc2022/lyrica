# The settings.yml install.sh writes to /etc/lyrica/searxng/ for the SearXNG
# it runs (docs/guides/searxng.md), with @SECRET@ replaced by a random key.
# install.sh writes it once; edit the copy there, then
# systemctl restart lyrica-searxng.
use_default_settings: true

server:
  secret_key: "@SECRET@"
  limiter: false        # a private instance on 127.0.0.1 needs no bot protection
  image_proxy: false

search:
  formats: [html, json] # json is what Lyrica asks for
  safe_search: 0
  default_lang: "auto"
  suspended_times:      # how long an engine rests after refusing, in seconds; SearXNG's own defaults rest one for up to a day
    SearxEngineAccessDenied: 600
    SearxEngineCaptcha: 900
    SearxEngineTooManyRequests: 180

outgoing:
  request_timeout: 6.0  # qwant and yahoo take longer than SearXNG's 3 s
  max_request_timeout: 10.0

# General search asks five engines, so one resting after a CAPTCHA doesn't end her search.
engines:
  - name: bing
    disabled: false
  - name: qwant
    disabled: false
  - name: yahoo
    disabled: false
  - name: startpage     # answers every request with a proof-of-work CAPTCHA
    disabled: true
