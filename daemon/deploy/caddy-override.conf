# Drop-in for Caddy's own unit: /etc/systemd/system/caddy.service.d/override.conf
[Unit]
# Caddy binds the Tailscale address, which exists only once tailscaled is up.
After=tailscaled.service network-online.target
Wants=tailscaled.service network-online.target

[Service]
# Holds the admin socket (see the Caddyfile's global block).
RuntimeDirectory=caddy
RuntimeDirectoryMode=0750
# If the Tailscale address isn't there yet, try again.
Restart=on-failure
RestartSec=5
