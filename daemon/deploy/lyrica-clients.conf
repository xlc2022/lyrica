# The folder of lyricad's socket for `lyrica chat` and `lyrica mem`. Setgid, so
# the socket takes the lyrica-clients group: an account the operator adds to
# that group reaches the login prompt, and still needs a Lyrica password.
# daemon/deploy/install.sh installs it as /etc/tmpfiles.d/lyrica-clients.conf.
d /run/lyrica-clients 2750 lyrica lyrica-clients -
